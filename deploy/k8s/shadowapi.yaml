# Example Kubernetes deployment. Replace images and the CHANGE-ME secrets; not validated against a live cluster.
apiVersion: v1
kind: Namespace
metadata: {name: shadowapi}
---
apiVersion: v1
kind: Secret
metadata: {name: shadowapi-secrets, namespace: shadowapi}
type: Opaque
stringData:
  API_KEY: CHANGE-ME
  POSTGRES_PASSWORD: CHANGE-ME
  CLICKHOUSE_PASSWORD: CHANGE-ME
  JWT_HS256_SECRET: CHANGE-ME
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: shadowapi}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_DB, value: shadowapi}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: shadowapi-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, postgres]}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data, subPath: pg}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 10Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: shadowapi}
spec: {selector: {app: postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: clickhouse, namespace: shadowapi}
spec:
  serviceName: clickhouse
  replicas: 1
  selector: {matchLabels: {app: clickhouse}}
  template:
    metadata: {labels: {app: clickhouse}}
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          env:
            - {name: CLICKHOUSE_USER, value: default}
            - name: CLICKHOUSE_PASSWORD
              valueFrom: {secretKeyRef: {name: shadowapi-secrets, key: CLICKHOUSE_PASSWORD}}
          ports: [{containerPort: 8123}]
          readinessProbe: {httpGet: {path: /ping, port: 8123}, periodSeconds: 5}
          volumeMounts: [{name: data, mountPath: /var/lib/clickhouse}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: clickhouse, namespace: shadowapi}
spec: {selector: {app: clickhouse}, ports: [{port: 8123}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: control-plane, namespace: shadowapi}
spec:
  replicas: 2
  selector: {matchLabels: {app: control-plane}}
  template:
    metadata: {labels: {app: control-plane}}
    spec:
      containers:
        - name: control-plane
          image: shadowapi/control-plane:latest   # build from ./control-plane
          envFrom: [{secretRef: {name: shadowapi-secrets}}]
          env:
            - {name: CLICKHOUSE_URL, value: "http://clickhouse:8123"}
            - {name: DATABASE_URL, value: "postgresql+psycopg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/shadowapi"}
            - {name: WAF_URL, value: "http://gateway.shadowapi:9000"}      # your gateway's admin endpoint
            - {name: REDTEAM_ALLOWED_HOSTS, value: ""}                      # explicit allow-list for the red team
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /healthz, port: 8000}}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
---
apiVersion: v1
kind: Service
metadata: {name: control-plane, namespace: shadowapi}
spec: {selector: {app: control-plane}, ports: [{port: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: detector, namespace: shadowapi}
spec:
  replicas: 2
  selector: {matchLabels: {app: detector}}
  template:
    metadata: {labels: {app: detector}}
    spec:
      containers:
        - name: detector
          image: shadowapi/detector:latest   # build from ./detector
          envFrom: [{secretRef: {name: shadowapi-secrets}}]
          env: [{name: CONTROL_PLANE_URL, value: "http://control-plane:8000"}]
          ports: [{containerPort: 8081}]
          readinessProbe: {httpGet: {path: /healthz, port: 8081}}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
---
apiVersion: v1
kind: Service
metadata: {name: detector, namespace: shadowapi}
spec: {selector: {app: detector}, ports: [{port: 8081}]}
---
# One probe per node. Needs a privileged container to load eBPF programs; the image must also
# contain the compiled eBPF object (build probe/ebpf with nightly + bpf-linker) at PROBE_OBJECT.
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: probe, namespace: shadowapi}
spec:
  selector: {matchLabels: {app: probe}}
  template:
    metadata: {labels: {app: probe}}
    spec:
      hostPID: true
      containers:
        - name: probe
          image: shadowapi/probe-ebpf:latest   # custom image: shadowapi-probe binary + probe-ebpf object
          args: ["attach", "--object", "/opt/probe-ebpf", "--libssl", "/usr/lib/x86_64-linux-gnu/libssl.so.3"]
          env: [{name: DETECTOR_URL, value: "http://detector:8081"}]
          securityContext: {privileged: true}
          volumeMounts:
            - {name: sys, mountPath: /sys, readOnly: true}
      volumes:
        - {name: sys, hostPath: {path: /sys}}
