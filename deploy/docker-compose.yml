# End-to-end stack. Dev defaults only: override the secrets via environment/.env for anything real.
x-secrets: &secrets
  API_KEY: ${API_KEY:-dev-key}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres}
      POSTGRES_DB: shadowapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shadowapi"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev-clickhouse}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 3s
      retries: 20
    ports: ["127.0.0.1:8123:8123"]
    volumes: [chdata:/var/lib/clickhouse]

  control-plane:
    build: ../control-plane
    environment:
      <<: *secrets
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-dev-postgres}@postgres:5432/shadowapi
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev-clickhouse}
      WAF_URL: http://gateway:9000
      WAF_SHADOW_POLICY: ${WAF_SHADOW_POLICY:-monitor}
      REDTEAM_ALLOWED_HOSTS: gateway
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}   # Slack-compatible incoming webhook (optional)
      CLICKHOUSE_TTL_DAYS: ${CLICKHOUSE_TTL_DAYS:-90}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 3s
      retries: 20
    ports: ["127.0.0.1:8000:8000"]

  detector:
    build: ../detector
    environment:
      <<: *secrets
      JWT_HS256_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      CONTROL_PLANE_URL: http://control-plane:8000
    depends_on:
      control-plane: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 3s
      retries: 20
    ports: ["127.0.0.1:8081:8081"]

  # Demo target API behind the simulation probe (capture) and the WAF. Intentionally vulnerable.
  gateway:
    build: {context: .., dockerfile: gateway/Dockerfile}
    environment:
      DETECTOR_URL: http://detector:8081
      WAF_API_KEY: ${API_KEY:-dev-key}
    depends_on:
      detector: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:9000/health')"]
      interval: 3s
      retries: 20
    ports: ["127.0.0.1:9000:9000"]

  # Continuous fuzzing of newly discovered shadow endpoints.
  redteam:
    build: ../control-plane
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-dev-postgres}@postgres:5432/shadowapi
      REDTEAM_TARGET: http://gateway:9000
      REDTEAM_ALLOWED_HOSTS: gateway
      REDTEAM_INTERVAL: "15"
    depends_on:
      control-plane: {condition: service_healthy}
      gateway: {condition: service_healthy}

  # Replays sample raw HTTP captures through the Rust probe (simulation mode): `--profile sim`.
  probe-sim:
    profiles: [sim]
    build: {context: .., dockerfile: probe/Dockerfile}
    environment: {DETECTOR_URL: "http://detector:8081"}
    depends_on:
      detector: {condition: service_healthy}

  # Full pipeline check: `docker compose --profile e2e run --rm e2e`.
  e2e:
    profiles: [e2e]
    image: python:3.12-slim
    working_dir: /w
    volumes: [../scripts:/w/scripts:ro, ../gateway/openapi.yaml:/w/gateway/openapi.yaml:ro]
    entrypoint: ["sh", "-c", "pip install -q httpx && python scripts/e2e.py"]
    environment:
      <<: *secrets
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      DETECTOR_URL: http://detector:8081
      CONTROL_URL: http://control-plane:8000
      GATEWAY_URL: http://gateway:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-dev-clickhouse}
      REDTEAM_TARGET: http://gateway:9000
    depends_on:
      gateway: {condition: service_healthy}

volumes:
  pgdata:
  chdata:
