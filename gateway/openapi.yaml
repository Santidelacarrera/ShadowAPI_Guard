openapi: 3.1.0
info: {title: Demo API, version: "1.0"}
paths:
  /health: {get: {responses: {"200": {description: ok}}}}
  /users/{userId}:
    get:
      responses:
        "200":
          description: user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
  /users/{userId}/orders: {get: {responses: {"200": {description: orders}}}}
  /accounts/{accountId}/statements: {get: {responses: {"200": {description: statements}}}}
components:
  schemas:
    User:
      type: object
      properties: {id: {type: integer}, name: {type: string}}
