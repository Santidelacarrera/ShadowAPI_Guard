[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-gateway"
version = "0.1.0"
description = "ShadowAPI Guard edge gateway: authenticated, sanitised, audited reverse proxy in front of ContextRAG_Engine and MultiAgent_Consensus"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/edge_gateway"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PLE", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # intentional non-ASCII: the detector's homoglyph/zero-width handling and Spanish text
    "RUF012",                      # class-level mutable defaults are not used on shared state here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011", "SIM117", "RUF059"]
"scripts/*" = ["E501"]
"src/edge_gateway/threats.py" = ["E501"]  # one regular expression per line is easier to review than wrapped ones

[tool.ruff.lint.isort]
known-first-party = ["edge_gateway"]
known-local-folder = ["conftest", "detection_eval", "synthetic_traffic"]
