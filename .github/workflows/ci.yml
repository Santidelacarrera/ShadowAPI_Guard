name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: pg, POSTGRES_DB: shadowapi}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r control-plane/requirements.txt
      - run: cd control-plane && python -m pytest -q
        env: {TEST_DATABASE_URL: "postgresql+psycopg://postgres:pg@localhost:5432/shadowapi"}
      - uses: actions/setup-go@v5
        with: {go-version: "1.24"}
      - run: cd detector && go vet ./... && go test ./...
      - run: cargo test --workspace
  edge-gateway:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: edge-gateway}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]' -r ../control-plane/requirements.txt  # control-plane deps: contract test of the event schema
      - run: mypy --strict src/edge_gateway
      - run: pytest --cov=edge_gateway --cov-fail-under=90
  ebpf:
    # Smoke-tested locally (scripts/ebpf_smoke.sh); GitHub runners may restrict bpf(), hence continue-on-error.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --component rust-src
      - name: Install bpf-linker (linked against rustc's own LLVM, no system LLVM needed)
        run: |
          SYS=$(rustc +nightly --print sysroot)
          DRV=$(ls "$SYS/lib" | grep -o 'rustc_driver-[0-9a-f]*' | head -1)
          LLVM=$(ls "$SYS/lib" | grep -o 'libLLVM-[0-9]*-rust-[^ ]*\.so' | head -1 | sed 's/^lib//; s/\.so$//')
          MAJOR=$(rustc +nightly -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')
          echo "rustc LLVM major: $MAJOR ($LLVM, $DRV)"
          RUSTFLAGS="-C link-arg=-L$SYS/lib -C link-arg=-l$DRV -C link-arg=-l$LLVM -C link-arg=-Wl,-rpath,$SYS/lib" \
            cargo +nightly install bpf-linker --no-default-features --features "llvm-$MAJOR,no-llvm-linking"
      - run: cd probe/ebpf && cargo +nightly build --release
      - run: sudo -E env "PATH=$PATH" ./scripts/ebpf_smoke.sh
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd deploy && docker compose up -d --build --wait
      - run: cd deploy && docker compose --profile e2e run --rm e2e
      - if: failure()
        run: cd deploy && docker compose logs --tail=100
